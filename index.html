<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Code Studio</title>

<style>
    
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: radial-gradient(circle at top left, #172554, #0b1120 45%, #020617);
    color: #e5e7eb;
}

/* HEADER */
.header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(15, 23, 42, .95);
    border-bottom: 1px solid #26344d;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: linear-gradient(135deg, #4f7cff, #7c3aed);
    font-size: 22px;
    font-weight: bold;
}

.title h1 {
    margin: 0;
    font-size: 19px;
}

.title span {
    color: #94a3b8;
    font-size: 12px;
}

.actions {
    display: flex;
    gap: 8px;
}

button {
    font-family: inherit;
}

.action-btn,
.small-btn {
    border: 1px solid #334155;
    background: #111827;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
}

.action-btn:hover,
.small-btn:hover {
    background: #1e293b;
    border-color: #4f7cff;
}

/* MAIN */
.main {
    padding: 16px;
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) 120px minmax(300px, 1fr);
    gap: 14px;
    min-height: calc(100vh - 70px);
}

/* PANELS */
.panel {
    background: #0f172a;
    border: 1px solid #26344d;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.panel-header {
    height: 47px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: #111827;
    border-bottom: 1px solid #26344d;
}

.panel-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    font-weight: bold;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #3b82f6;
}

.dot.green {
    background: #22c55e;
}

.dot.red {
    background: #ef4444;
}

/* EDITOR */
.editor-panel {
    min-height: 700px;
    display: flex;
    flex-direction: column;
}

.editor {
    flex: 1;
    display: flex;
    min-height: 0;
    background: #080f1d;
    position: relative;
}

.line-numbers {
    width: 55px;
    padding: 15px 10px;
    color: #52627a;
    background: #070d18;
    border-right: 1px solid #1e2b41;
    text-align: right;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 23px;
    white-space: pre;
    user-select: none;
    overflow: hidden;
}

.code-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
}

#code {
    width: 100%;
    height: 100%;
    min-height: 620px;
    border: none;
    outline: none;
    resize: none;
    padding: 15px;
    background: transparent;
    color: #dbeafe;
    caret-color: #60a5fa;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 23px;
    tab-size: 4;
}

#code::selection {
    background: rgba(59,130,246,.35);
}

.editor-footer {
    height: 31px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    color: #64748b;
    font-size: 11px;
    background: #080d17;
    border-top: 1px solid #26344d;
}

/* ERROR BAR */
.error-bar {
    display: none;
    padding: 9px 13px;
    background: #2a1015;
    color: #fca5a5;
    border-top: 1px solid #7f1d1d;
    font-family: Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
}

.error-bar.show {
    display: block;
}

/* CONTROLS */
.controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-top: 47px;
}

.control-btn {
    width: 108px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #172033;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.control-btn:hover {
    transform: translateY(-2px);
}

.run {
    border: none;
    background: linear-gradient(135deg, #16a34a, #22c55e);
}

.stop {
    color: #fecaca;
}

.clear {
    color: #fde68a;
}

.status {
    width: 108px;
    padding: 8px 5px;
    border-radius: 9px;
    border: 1px solid #26344d;
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
}

/* RIGHT SIDE & CONSOLE */
.right {
    display: grid;
    grid-template-rows: 1fr 180px;
    gap: 12px;
    min-height: 700px;
}

.output-panel,
.error-panel {
    display: flex;
    flex-direction: column;
}

.terminal-body {
    flex: 1;
    background: #0c0c0c;
    color: #cccccc;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    padding: 14px;
    overflow-y: auto;
    cursor: text;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
}

.terminal-input {
    background: transparent;
    border: none;
    outline: none;
    color: #00ff66;
    font-family: inherit;
    font-size: inherit;
    padding: 0;
    margin: 0;
    width: 150px;
}

.error-output {
    flex: 1;
    margin: 0;
    padding: 14px;
    overflow: auto;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 22px;
    white-space: pre-wrap;
    background: #090e18;
    color: #94a3b8;
}

.error-output.error {
    color: #fca5a5;
}

.error-output.success {
    color: #86efac;
}

/* MOBILE */
@media (max-width: 1050px) {
    .main {
        grid-template-columns: 1fr;
    }

    .controls {
        flex-direction: row;
        justify-content: center;
        padding-top: 0;
    }

    .right {
        min-height: 700px;
    }
}

@media (max-width: 600px) {
    .header {
        height: auto;
        padding: 12px;
        gap: 10px;
        flex-direction: column;
        align-items: stretch;
    }

    .actions {
        justify-content: center;
    }

    .main {
        padding: 10px;
    }

    .editor-panel {
        min-height: 600px;
    }

    #code {
        min-height: 500px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo-area">
        <div class="logo">C</div>
        <div class="title">
            <h1>C Code Studio</h1>
            <span>Online C Programming Environment</span>
        </div>
    </div>

    <div class="actions">
        <button class="action-btn" onclick="copyCode()">📋 Copy</button>
        <button class="action-btn" onclick="saveCode()">💾 Save .c</button>
    </div>
</header>

<main class="main">

    <!-- EDITOR -->
    <section class="panel editor-panel">
        <div class="panel-header">
            <div class="panel-title">
                <span class="dot"></span>
                โปรแกรมภาษา C
            </div>
            <button class="small-btn" onclick="templateCode()">Template</button>
        </div>

        <div class="editor">
            <div class="line-numbers" id="lineNumbers">1</div>
            <div class="code-wrap">
                <textarea
                    id="code"
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                ></textarea>
            </div>
        </div>

        <div class="error-bar" id="errorBar"></div>

        <div class="editor-footer">
            <span>C • UTF-8</span>
            <span id="position">Ln 1, Col 1</span>
            <span>Ctrl + Enter = Run</span>
        </div>
    </section>

    <!-- BUTTONS -->
    <section class="controls">
        <button class="control-btn run" onclick="runCode()">▶ Run</button>
        <button class="control-btn stop" onclick="stopCode()">⏹ Stop</button>
        <button class="control-btn clear" onclick="clearAll()">🗑 Clear</button>
        <div class="status" id="status">● Ready</div>
    </section>

    <!-- RIGHT SIDE -->
    <section class="right">

        <!-- INTERACTIVE CONSOLE TERMINAL -->
        <div class="panel output-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span class="dot green"></span>
                    Console Output (Dev-C++ Mode)
                </div>
                <button class="small-btn" onclick="clearOutput()">Clear</button>
            </div>

            <div class="terminal-body" id="terminal" onclick="focusConsoleInput()">
                <span id="terminalContent">กด Run เพื่อเริ่มประมวลผลโปรแกรม...</span>
                <span id="interactiveLine" style="display: none;">
                    <input type="text" id="consoleInput" class="terminal-input" autocomplete="off" onkeydown="handleConsoleInput(event)" />
                </span>
            </div>
        </div>

        <!-- ERROR -->
        <div class="panel error-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span class="dot red"></span>
                    Compile / Runtime Log
                </div>
            </div>
            <pre class="error-output" id="errorOutput">พร้อมทำงาน</pre>
        </div>

    </section>

</main>

<script>
const code = document.getElementById("code");
const lineNumbers = document.getElementById("lineNumbers");
const errorOutput = document.getElementById("errorOutput");
const errorBar = document.getElementById("errorBar");
const status = document.getElementById("status");
const position = document.getElementById("position");

const terminalContent = document.getElementById("terminalContent");
const interactiveLine = document.getElementById("interactiveLine");
const consoleInput = document.getElementById("consoleInput");

let waitingResolver = null;
let isProgramRunning = false;

const starterCode =
`#include <stdio.h>

int main() {
    int a, b;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    printf("Sum = %d\\n", a + b);

    return 0;
}`;

code.value = starterCode;

/* LINE NUMBERS & POSITION */
function updateLines() {
    const count = code.value.split("\n").length;
    let result = "";
    for (let i = 1; i <= count; i++) result += i + "\n";
    lineNumbers.textContent = result;
}

function updatePosition() {
    const cursor = code.selectionStart;
    const text = code.value.substring(0, cursor);
    const lines = text.split("\n");
    position.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
}

/* CHECK CODE */
function checkCode() {
    const source = code.value;
    const errors = [];

    if (!source.trim()) errors.push("Line 1: โปรแกรมว่าง");
    if (source.trim() && !/main\s*\(/.test(source)) errors.push("ไม่พบฟังก์ชัน main()");

    const openBrace = (source.match(/\{/g) || []).length;
    const closeBrace = (source.match(/\}/g) || []).length;
    if (openBrace !== closeBrace) errors.push("วงเล็บปีกกา { } ไม่ครบหรือไม่สมดุล");

    const openParen = (source.match(/\(/g) || []).length;
    const closeParen = (source.match(/\)/g) || []).length;
    if (openParen !== closeParen) errors.push("วงเล็บ ( ) ไม่ครบหรือไม่สมดุล");

    showErrors(errors);
    return errors;
}

function showErrors(errors) {
    if (errors.length > 0) {
        errorBar.classList.add("show");
        errorBar.textContent = "⚠ ตรวจพบ:\n" + errors.join("\n");
        errorOutput.className = "error-output error";
        errorOutput.textContent = errors.join("\n");
    } else {
        errorBar.classList.remove("show");
        errorOutput.className = "error-output success";
        errorOutput.textContent = "✓ ไม่พบข้อผิดพลาดเบื้องต้น";
    }
}

/* KEYBOARD & EVENT LISTENERS */
code.addEventListener("keydown", function(event) {
    if (event.key === "Tab") {
        event.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
        updateLines();
        updatePosition();
        checkCode();
    }
    if (event.ctrlKey && event.key === "Enter") {
        event.preventDefault();
        runCode();
    }
});

code.addEventListener("input", () => { updateLines(); updatePosition(); checkCode(); });
code.addEventListener("click", updatePosition);
code.addEventListener("keyup", updatePosition);
code.addEventListener("scroll", () => { lineNumbers.scrollTop = code.scrollTop; });

/* INTERACTIVE CONSOLE HANDLERS */
function focusConsoleInput() {
    if (interactiveLine.style.display !== "none") {
        consoleInput.focus();
    }
}

function readConsoleInput() {
    return new Promise((resolve) => {
        waitingResolver = resolve;
        interactiveLine.style.display = "inline";
        consoleInput.value = "";
        consoleInput.focus();
    });
}

function handleConsoleInput(event) {
    if (event.key === "Enter") {
        const val = consoleInput.value;
        interactiveLine.style.display = "none";
        terminalContent.textContent += val + "\n";
        if (waitingResolver) {
            const resolve = waitingResolver;
            waitingResolver = null;
            resolve(val);
        }
    }
}

function clearOutput() {
    terminalContent.textContent = "";
    interactiveLine.style.display = "none";
}

/* RUN / STOP / TEMPLATE */
function templateCode() {
    code.value = starterCode;
    updateLines();
    updatePosition();
    checkCode();
    clearOutput();
    terminalContent.textContent = "กด Run เพื่อเริ่มประมวลผลโปรแกรม...";
    status.textContent = "● Ready";
    code.focus();
}

function runCode() {
    const source = code.value.trim();
    if (!source) return;

    const errors = checkCode();
    if (errors.length > 0) {
        status.textContent = "● Error";
        return;
    }

    status.textContent = "● Running...";
    clearOutput();
    isProgramRunning = true;

    setTimeout(async function() {
        try {
            await simulateC();
        } catch (error) {
            showRuntimeError("Runtime Error: " + error.message);
        }
    }, 200);
}

function stopCode() {
    isProgramRunning = false;
    interactiveLine.style.display = "none";
    if (waitingResolver) {
        waitingResolver = null;
    }
    status.textContent = "● Stopped";
    terminalContent.textContent += "\n--------------------------------\n[Program stopped by user]";
    errorOutput.className = "error-output error";
    errorOutput.textContent = "⏹ หยุดการทำงานโดยผู้ใช้";
}

/* SIMULATE C INTERACTIVE */
async function simulateC() {
    const source = code.value;
    const variables = {};

    const statements = source
        .replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, "")
        .split(";")
        .map(s => s.trim())
        .filter(Boolean);

    for (let statement of statements) {
        if (!isProgramRunning) return;

        if (statement.startsWith("int ")) {
            const decl = statement.replace("int ", "").trim();
            decl.split(",").forEach(p => {
                const parts = p.split("=");
                const name = parts[0].trim();
                const val = parts[1] ? evaluate(parts[1].trim(), variables) : 0;
                if (name) variables[name] = Number(val) || 0;
            });
        }

        if (statement.includes("printf")) {
            const match = /printf\s*\(\s*"([\s\S]*?)"\s*(?:,\s*([\s\S]*?))?\s*\)/.exec(statement);
            if (match) {
                let text = match[1];
                const args = match[2] ? splitArguments(match[2]) : [];
                let argIdx = 0;

                text = text.replace(/%(\.?\d*)f/g, (m, p) => {
                    const val = evaluate(args[argIdx++], variables);
                    return Number(val).toFixed(p ? parseInt(p.replace(".", "")) : 6);
                });
                text = text.replace(/%d/g, () => evaluate(args[argIdx++], variables));
                text = text.replace(/%c/g, () => evaluate(args[argIdx++], variables));
                text = text.replace(/\\n/g, "\n").replace(/\\t/g, "\t").replace(/\\"/g, '"');

                terminalContent.textContent += text;
            }
        }

        if (statement.includes("scanf")) {
            const match = /scanf\s*\(\s*"([^"]*)"\s*,\s*([^)]+)\)/.exec(statement);
            if (match) {
                const format = match[1];
                const args = match[2].split(",").map(x => x.replace("&", "").trim());
                const formats = format.match(/%[dfc]/g) || [];

                for (let i = 0; i < formats.length; i++) {
                    if (!isProgramRunning) return;
                    const varName = args[i];
                    const inputVal = await readConsoleInput();

                    if (inputVal.includes(" ")) {
                        const tokens = inputVal.split(/\s+/);
                        tokens.forEach((tok, idx) => {
                            if (args[i + idx]) {
                                variables[args[i + idx]] = isNaN(tok) ? tok : Number(tok);
                            }
                        });
                        break;
                    } else {
                        variables[varName] = isNaN(inputVal) ? inputVal : Number(inputVal);
                    }
                }
            }
        }
    }

    if (isProgramRunning) {
        terminalContent.textContent += "\n--------------------------------\nProcess exited after execution.";
        errorOutput.className = "error-output success";
        errorOutput.textContent = "✓ Compile สำเร็จ\n✓ Program finished successfully.";
        status.textContent = "● Ready";
        isProgramRunning = false;
    }
}

function splitArguments(text) {
    if (!text.trim()) return [];
    const result = [];
    let current = "", depth = 0;
    for (let char of text) {
        if (char === "(") depth++;
        if (char === ")") depth--;
        if (char === "," && depth === 0) {
            result.push(current.trim());
            current = "";
        } else {
            current += char;
        }
    }
    if (current.trim()) result.push(current.trim());
    return result;
}

function evaluate(expression, variables) {
    if (!expression) return "";
    expression = expression.trim();
    if (expression.startsWith('"') && expression.endsWith('"')) return expression.slice(1, -1);
    if (expression.startsWith("'") && expression.endsWith("'")) return expression.slice(1, -1);

    let formula = expression.replace(/\b[A-Za-z_]\w*\b/g, name => {
        return Object.prototype.hasOwnProperty.call(variables, name) ? variables[name] : name;
    });

    if (/^[0-9+\-*/%().\s]+$/.test(formula)) {
        try {
            return Function("return (" + formula + ")")();
        } catch {
            return formula;
        }
    }
    return formula;
}

function clearAll() {
    code.value = "";
    clearOutput();
    errorOutput.className = "error-output";
    errorOutput.textContent = "พร้อมทำงาน";
    errorBar.classList.remove("show");
    status.textContent = "● Ready";
    updateLines();
    updatePosition();
    code.focus();
}

async function copyCode() {
    try {
        await navigator.clipboard.writeText(code.value);
        status.textContent = "● Copied";
        setTimeout(() => { status.textContent = "● Ready"; }, 1200);
    } catch {
        code.select();
        document.execCommand("copy");
        status.textContent = "● Copied";
    }
}

function saveCode() {
    const blob = new Blob([code.value], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "main.c";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    status.textContent = "● Saved";
}

function showRuntimeError(message) {
    terminalContent.textContent += "\n[Runtime Error]";
    errorOutput.className = "error-output error";
    errorOutput.textContent = message;
    status.textContent = "● Error";
    isProgramRunning = false;
}

updateLines();
updatePosition();
checkCode();
</script>
<!-- ดึงตัวรันภาษา C (JSCPP Engine) เข้ามาใช้งานในเว็บ -->
<script src="https://cdn.jsdelivr.net/npm/jscpp@2.0.7/dist/JSCPP.es5.min.js"></script>
</body>
</html>
