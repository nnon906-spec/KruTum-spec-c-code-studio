<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Code Studio</title>

<!-- โหลด JSCPP Engine ไว้ใน <head> -->
<script src="https://cdn.jsdelivr.net/npm/jscpp@2.0.7/dist/JSCPP.es5.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: radial-gradient(circle at top left, #172554, #0b1120 45%, #020617);
    color: #e5e7eb;
}
.header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(15, 23, 42, .95);
    border-bottom: 1px solid #26344d;
}
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    background: linear-gradient(135deg, #4f7cff, #7c3aed);
    font-size: 22px; font-weight: bold;
}
.title h1 { margin: 0; font-size: 19px; }
.title span { color: #94a3b8; font-size: 12px; }
.actions { display: flex; gap: 8px; }
.action-btn, .small-btn {
    border: 1px solid #334155;
    background: #111827;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
}
.action-btn:hover, .small-btn:hover { background: #1e293b; border-color: #4f7cff; }

.main {
    padding: 16px;
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) 120px minmax(300px, 1fr);
    gap: 14px;
    min-height: calc(100vh - 70px);
}
.panel {
    background: #0f172a;
    border: 1px solid #26344d;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}
.panel-header {
    height: 47px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: #111827;
    border-bottom: 1px solid #26344d;
}
.panel-title { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: bold; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #3b82f6; }
.dot.green { background: #22c55e; }
.dot.red { background: #ef4444; }

.editor-panel { min-height: 700px; display: flex; flex-direction: column; }
.editor { flex: 1; display: flex; min-height: 0; background: #080f1d; position: relative; }
.line-numbers {
    width: 55px; padding: 15px 10px; color: #52627a; background: #070d18;
    border-right: 1px solid #1e2b41; text-align: right; font-family: Consolas, monospace;
    font-size: 14px; line-height: 23px; white-space: pre; user-select: none; overflow: hidden;
}
.code-wrap { position: relative; flex: 1; min-width: 0; }
#code {
    width: 100%; height: 100%; min-height: 620px; border: none; outline: none; resize: none;
    padding: 15px; background: transparent; color: #dbeafe; caret-color: #60a5fa;
    font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 23px; tab-size: 4;
}
.editor-footer {
    height: 31px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; color: #64748b; font-size: 11px; background: #080d17; border-top: 1px solid #26344d;
}
.error-bar {
    display: none; padding: 9px 13px; background: #2a1015; color: #fca5a5;
    border-top: 1px solid #7f1d1d; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap;
}
.error-bar.show { display: block; }

.controls { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 47px; }
.control-btn {
    width: 108px; height: 44px; border-radius: 10px; border: 1px solid #334155;
    background: #172033; color: white; font-weight: bold; cursor: pointer; transition: .2s;
}
.control-btn:hover { transform: translateY(-2px); }
.run { border: none; background: linear-gradient(135deg, #16a34a, #22c55e); }
.stop { color: #fecaca; }
.clear { color: #fde68a; }
.status {
    width: 108px; padding: 8px 5px; border-radius: 9px; border: 1px solid #26344d;
    text-align: center; color: #94a3b8; font-size: 11px;
}

.right { display: grid; grid-template-rows: 120px 1fr 140px; gap: 12px; min-height: 700px; }
.input-area {
    width: 100%; height: 100%; background: #0c0c0c; border: none; outline: none;
    color: #38bdf8; font-family: Consolas, monospace; font-size: 13px; padding: 10px; resize: none;
}
.terminal-body {
    flex: 1; background: #0c0c0c; color: #cccccc; font-family: Consolas, monospace;
    font-size: 14px; padding: 14px; overflow-y: auto; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
}
.error-output {
    flex: 1; margin: 0; padding: 14px; overflow: auto; font-family: Consolas, monospace;
    font-size: 13px; line-height: 22px; white-space: pre-wrap; background: #090e18; color: #94a3b8;
}
.error-output.error { color: #fca5a5; }
.error-output.success { color: #86efac; }

@media (max-width: 1050px) {
    .main { grid-template-columns: 1fr; }
    .controls { flex-direction: row; justify-content: center; padding-top: 0; }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo-area">
        <div class="logo">C</div>
        <div class="title">
            <h1>C Code Studio</h1>
            <span>Online C Programming Environment</span>
        </div>
    </div>
    <div class="actions">
        <button class="action-btn" onclick="copyCode()">📋 Copy</button>
        <button class="action-btn" onclick="saveCode()">💾 Save .c</button>
    </div>
</header>

<main class="main">

    <!-- EDITOR -->
    <section class="panel editor-panel">
        <div class="panel-header">
            <div class="panel-title"><span class="dot"></span> โปรแกรมภาษา C</div>
            <button class="small-btn" onclick="templateCode()">Template</button>
        </div>

        <div class="editor">
            <div class="line-numbers" id="lineNumbers">1</div>
            <div class="code-wrap">
                <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
            </div>
        </div>

        <div class="error-bar" id="errorBar"></div>

        <div class="editor-footer">
            <span>C • UTF-8</span>
            <span id="position">Ln 1, Col 1</span>
            <span>Ctrl + Enter = Run</span>
        </div>
    </section>

    <!-- BUTTONS -->
    <section class="controls">
        <button class="control-btn run" onclick="runCode()">▶ Run</button>
        <button class="control-btn stop" onclick="stopCode()">⏹ Stop</button>
        <button class="control-btn clear" onclick="clearAll()">🗑 Clear</button>
        <div class="status" id="status">● Ready</div>
    </section>

    <!-- RIGHT SIDE -->
    <section class="right">

        <!-- INPUT PANEL (สำหรับ scanf) -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title"><span class="dot"></span> STDIN (ป้อนข้อมูลสำหรับ scanf)</div>
            </div>
            <textarea id="customInput" class="input-area" placeholder="ใส่ข้อมูลสำหรับ scanf ที่นี่ (หากมีหลายค่าให้เว้นบรรทัด)..."></textarea>
        </div>

        <!-- CONSOLE OUTPUT -->
        <div class="panel" style="display:flex; flex-direction:column;">
            <div class="panel-header">
                <div class="panel-title"><span class="dot green"></span> Console Output</div>
                <button class="small-btn" onclick="clearOutput()">Clear</button>
            </div>
            <div class="terminal-body" id="terminalContent">กด Run เพื่อเริ่มประมวลผลโปรแกรม...</div>
        </div>

        <!-- ERROR LOG -->
        <div class="panel" style="display:flex; flex-direction:column;">
            <div class="panel-header">
                <div class="panel-title"><span class="dot red"></span> Compile / Runtime Log</div>
            </div>
            <pre class="error-output" id="errorOutput">พร้อมทำงาน</pre>
        </div>

    </section>

</main>

<script>
const code = document.getElementById("code");
const lineNumbers = document.getElementById("lineNumbers");
const errorOutput = document.getElementById("errorOutput");
const errorBar = document.getElementById("errorBar");
const status = document.getElementById("status");
const position = document.getElementById("position");
const terminalContent = document.getElementById("terminalContent");
const customInput = document.getElementById("customInput");

const starterCode =
`#include <stdio.h>

int main() {
    int a, b;
    printf("Enter two numbers: ");
    
    // JSCPP จะดึงค่าจากช่อง STDIN ด้านบนมาใส่ให้ scanf
    scanf("%d %d", &a, &b);

    printf("\\nSum = %d\\n", a + b);
    return 0;
}`;

code.value = starterCode;
customInput.value = "10 20"; // ตัวอย่าง Input สำหรับ scanf

function updateLines() {
    const count = code.value.split("\n").length;
    let result = "";
    for (let i = 1; i <= count; i++) result += i + "\n";
    lineNumbers.textContent = result;
}

function updatePosition() {
    const cursor = code.selectionStart;
    const text = code.value.substring(0, cursor);
    const lines = text.split("\n");
    position.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
}

function checkCode() {
    const source = code.value;
    const errors = [];

    if (!source.trim()) errors.push("Line 1: โปรแกรมว่าง");
    if (source.trim() && !/main\s*\(/.test(source)) errors.push("ไม่พบฟังก์ชัน main()");

    const openBrace = (source.match(/\{/g) || []).length;
    const closeBrace = (source.match(/\}/g) || []).length;
    if (openBrace !== closeBrace) errors.push("วงเล็บปีกกา { } ไม่สมดุล");

    if (errors.length > 0) {
        errorBar.classList.add("show");
        errorBar.textContent = "⚠ ตรวจพบ:\n" + errors.join("\n");
        errorOutput.className = "error-output error";
        errorOutput.textContent = errors.join("\n");
    } else {
        errorBar.classList.remove("show");
        errorOutput.className = "error-output success";
        errorOutput.textContent = "✓ ไม่พบข้อผิดพลาดไวยากรณ์เบื้องต้น";
    }
    return errors;
}

code.addEventListener("keydown", function(event) {
    if (event.key === "Tab") {
        event.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
        updateLines();
        updatePosition();
    }
    if (event.ctrlKey && event.key === "Enter") {
        event.preventDefault();
        runCode();
    }
});

code.addEventListener("input", () => { updateLines(); updatePosition(); checkCode(); });
code.addEventListener("click", updatePosition);
code.addEventListener("keyup", updatePosition);
code.addEventListener("scroll", () => { lineNumbers.scrollTop = code.scrollTop; });

function clearOutput() {
    terminalContent.textContent = "";
}

function runCode() {
    const source = code.value.trim();
    if (!source) return;

    status.textContent = "● Running...";
    clearOutput();

    const inputData = customInput.value; // ดึงค่าจากกล่อง STDIN

    const config = {
        stdio: {
            write: function(str) {
                terminalContent.textContent += str;
            },
            drain: function() {}
        }
    };

    setTimeout(() => {
        try {
            // เรียกใช้ JSCPP โดยส่งค่า Source Code และ Input เข้าไป
            JSCPP.run(source, inputData, config);

            terminalContent.textContent += "\n--------------------------------\nProcess exited successfully.";
            errorOutput.className = "error-output success";
            errorOutput.textContent = "✓ Compile และประมวลผลสำเร็จ";
            status.textContent = "● Ready";
        } catch (error) {
            terminalContent.textContent += "\n[Runtime Error]";
            errorOutput.className = "error-output error";
            errorOutput.textContent = "Runtime Error:\n" + error.message;
            status.textContent = "● Error";
        }
    }, 50);
}

function stopCode() {
    status.textContent = "● Stopped";
    terminalContent.textContent += "\n[Stopped by user]";
}

function templateCode() {
    code.value = starterCode;
    customInput.value = "10 20";
    updateLines();
    updatePosition();
    checkCode();
    clearOutput();
    status.textContent = "● Ready";
}

function clearAll() {
    code.value = "";
    customInput.value = "";
    clearOutput();
    errorOutput.className = "error-output";
    errorOutput.textContent = "พร้อมทำงาน";
    errorBar.classList.remove("show");
    status.textContent = "● Ready";
    updateLines();
}

async function copyCode() {
    await navigator.clipboard.writeText(code.value);
    status.textContent = "● Copied";
    setTimeout(() => { status.textContent = "● Ready"; }, 1200);
}

function saveCode() {
    const blob = new Blob([code.value], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "main.c";
    link.click();
    URL.revokeObjectURL(url);
}

updateLines();
updatePosition();
checkCode();
</script>
</body>
</html>
